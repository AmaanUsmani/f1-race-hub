<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Race Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css?v=7">
    <link rel="stylesheet" href="css/header.css?v=5">
    <link rel="stylesheet" href="css/home.css?v=6">
    <link rel="stylesheet" href="css/calendar.css?v=3">
    <link rel="stylesheet" href="css/shared.css?v=3">
    <link rel="stylesheet" href="css/standings.css?v=2">
    <link rel="stylesheet" href="css/race.css?v=8">
</head>
<body>

    <div id="wallpaper-layer"></div>
    <div id="app"></div>

    <div id="settings-modal" style="display:none" onclick="if(event.target===this)closeSettings()">
        <div class="settings-modal-box">
            <div class="settings-modal-header">
                <span class="settings-modal-title">Settings</span>
                <button class="settings-modal-close" onclick="closeSettings()">✕</button>
            </div>
            <div class="settings-modal-body">
                <div class="settings-section-label">Favorite Driver Wallpaper</div>
                <div id="settings-driver-grid"></div>
            </div>
        </div>
    </div>

    <div id="winners-modal" style="display:none" onclick="if(event.target===this)closeWinnersModal()">
        <div class="winners-modal-box">
            <div class="winners-modal-header">
                <span class="winners-modal-title">All Race Winners</span>
                <button class="winners-modal-close" onclick="closeWinnersModal()">✕</button>
            </div>
            <div class="winners-modal-body" id="winners-modal-body"></div>
        </div>
    </div>

    <script src="js/components/header.js?v=21"></script>
    <script src="js/config.js?v=17"></script>
    <script src="js/utils.js?v=16"></script>
    <script src="js/api.js?v=17"></script>
    <script src="js/render.js?v=19"></script>
    <script src="js/sections/standings.js?v=16"></script>
    <script src="js/sections/race.js?v=25"></script>
    <script src="js/pages/home.js?v=16"></script>
    <script src="js/pages/season.js?v=16"></script>
    <script src="js/app.js?v=24"></script>
</body>
</html>
